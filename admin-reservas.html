<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Reservas — Pousada Constelação</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#2F4A3A; --olive:#5D7258; --beige:#E8DFD1;
    --white-warm:#FAF8F4; --wood:#7A5B45; --gold:#B89A68;
    --busy:#dcb0a8; --busy-text:#5c2a22;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--white-warm);color:var(--forest);font-family:'Work Sans',sans-serif;font-weight:300;padding:48px 24px;}
  .wrap{max-width:1200px;margin:0 auto;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:32px;border-bottom:1px solid rgba(47,74,58,.15);padding-bottom:28px;}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:32px;}
  h1 span{color:var(--gold);font-style:italic;}
  .sub{font-size:13px;color:var(--olive);margin-top:6px;}
  .btn{padding:10px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;background:var(--forest);color:var(--white-warm);cursor:pointer;border:none;font-family:inherit;}
  .btn:hover{background:var(--olive);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.small{padding:6px 12px;font-size:10px;}
  .btn.confirm{background:#3f6b4a;}
  .btn.cancel{background:transparent;border:1px solid #a3453a;color:#a3453a;}
  .btn.cancel:hover{background:#a3453a;color:#fff;}
  .logout-btn{background:transparent;border:1px solid rgba(47,74,58,.25);color:var(--forest);}
  .logout-btn:hover{background:var(--beige);}

  /* --- Layout principal: lista + calendário lado a lado --- */
  .layout{display:grid;grid-template-columns:1.6fr 1fr;gap:36px;align-items:start;}
  @media(max-width:960px){.layout{grid-template-columns:1fr;}}

  /* --- Filtros --- */
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:22px;}
  .filter-field{display:flex;flex-direction:column;gap:5px;}
  .filter-field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--olive);}
  .filter-field input, .filter-field select{
    border:1px solid rgba(47,74,58,.2);padding:9px 12px;font-family:inherit;font-size:13px;border-radius:2px;min-width:150px;
  }
  .filters .btn{height:38px;}

  .status{font-size:13px;color:var(--olive);margin-bottom:16px;}
  .status.error{color:#a3453a;}

  table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 8px 30px rgba(20,30,24,.06);}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--gold);padding:14px 16px;border-bottom:1px solid rgba(47,74,58,.12);font-weight:500;
  }
  tbody td{padding:14px 16px;border-bottom:1px solid rgba(47,74,58,.08);font-size:13px;vertical-align:top;}
  tbody tr:hover{background:var(--beige);}
  .empty, .loading{padding:60px 20px;text-align:center;color:var(--olive);font-size:14px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--beige);color:var(--forest);}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
  .pill.pendente{background:#f1e3c6;color:#8a6d1f;}
  .pill.confirmada{background:#d7e6da;color:#2F4A3A;}
  .pill.cancelada{background:#f2d9d5;color:#a3453a;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .login-wrap{max-width:360px;margin:120px auto;text-align:left;}
  .login-wrap h1{font-size:26px;margin-bottom:8px;}
  .login-wrap p{font-size:13px;color:var(--olive);margin-bottom:28px;}
  .login-wrap label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--olive);margin-bottom:6px;}
  .login-wrap input{width:100%;border:1px solid rgba(47,74,58,.2);padding:11px 14px;font-family:inherit;font-size:14px;border-radius:2px;margin-bottom:18px;}
  .login-wrap .btn{width:100%;padding:13px;}

  /* --- Calendário --- */
  .cal-card{background:#fff;box-shadow:0 8px 30px rgba(20,30,24,.06);padding:24px;}
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-header h3{font-family:'Fraunces',serif;font-weight:500;font-size:16px;text-transform:capitalize;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{border:1px solid rgba(47,74,58,.2);background:transparent;width:28px;height:28px;border-radius:2px;cursor:pointer;color:var(--forest);font-size:13px;}
  .cal-nav button:hover{background:var(--beige);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:9px;text-align:center;color:var(--olive);text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px;}
  .cal-day{font-size:12px;text-align:center;padding:8px 0;border-radius:3px;color:var(--forest);position:relative;cursor:default;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.pendente{background:#f1e3c6;color:#8a6d1f;font-weight:600;}
  .cal-day.confirmada{background:var(--busy);color:var(--busy-text);font-weight:600;}
  .cal-legend{display:flex;gap:14px;font-size:11px;color:var(--olive);margin-top:14px;flex-wrap:wrap;}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px;}
  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cal-legend .sw-pendente{background:#f1e3c6;}
  .cal-legend .sw-confirmada{background:var(--busy);}

  @media(max-width:760px){
    table, thead, tbody, tr, td{display:block;}
    thead{display:none;}
    tbody tr{margin-bottom:16px;border:1px solid rgba(47,74,58,.1);}
    tbody td{border-bottom:none;padding:10px 18px;}
    tbody td::before{content:attr(data-label);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:4px;}
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <h1>Painel de <span style="color:var(--gold);font-style:italic;">Reservas</span></h1>
  <p>Digite a chave de acesso do administrador para ver as reservas recebidas.</p>
  <form id="loginForm">
    <label for="loginKey">Chave de acesso</label>
    <input type="password" id="loginKey" required autocomplete="off">
    <button type="submit" class="btn" id="loginBtn">Entrar</button>
    <p class="status error" id="loginStatus" style="margin-top:16px;"></p>
  </form>
</div>

<div class="wrap" id="dashboardWrap" style="display:none;">
  <header>
    <div>
      <h1>Painel de <span>Reservas</span></h1>
      <div class="sub">Pousada Constelação — todas as solicitações recebidas pelo site</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn" id="refreshBtn">Atualizar</button>
      <button class="btn logout-btn" id="logoutBtn">Sair</button>
    </div>
  </header>

  <div class="layout">
    <div>
      <div class="filters">
        <div class="filter-field">
          <label for="fName">Nome do hóspede</label>
          <input type="text" id="fName" placeholder="Buscar por nome...">
        </div>
        <div class="filter-field">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="confirmada">Confirmada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="fFrom">A partir de (check-in)</label>
          <input type="date" id="fFrom">
        </div>
        <div class="filter-field">
          <label for="fTo">Até (check-in)</label>
          <input type="date" id="fTo">
        </div>
        <button class="btn small" id="clearFilters" type="button">Limpar filtros</button>
      </div>

      <p class="status" id="status">Carregando reservas...</p>

      <table id="table" style="display:none;">
        <thead>
          <tr>
            <th>Hóspede</th>
            <th>Contato</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Hóspedes</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="cal-card">
      <div class="cal-header">
        <h3 id="calTitle"></h3>
        <div class="cal-nav">
          <button id="calPrev" type="button">‹</button>
          <button id="calNext" type="button">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i class="sw-pendente"></i> Pendente</span>
        <span><i class="sw-confirmada"></i> Confirmada</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURAÇÃO DA PLANILHA (Google Sheets via Apps Script)
  // ============================================================
  const SHEETS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbygP_ayRV5SHZmrW1BvDwq0xKipjPksrQxBfwMnKNlTeKqh7CjshS0YqUBsNmHHweZ_/exec';
  const STORAGE_KEY = 'pousada_admin_key';

  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const tbody = document.getElementById('tbody');
  const loginWrap = document.getElementById('loginWrap');
  const dashboardWrap = document.getElementById('dashboardWrap');
  const loginForm = document.getElementById('loginForm');
  const loginStatus = document.getElementById('loginStatus');
  const loginBtn = document.getElementById('loginBtn');
  let allRows = [];
  let accessKey = '';
  let calDate = new Date(); // mês exibido no calendário

  // ---- Login gate: a chave é conferida pelo próprio Apps Script ----
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginStatus.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando...';
    const key = document.getElementById('loginKey').value.trim();
    const ok = await tryLoadWithKey(key);
    loginBtn.disabled = false;
    loginBtn.textContent = 'Entrar';
    if (!ok) {
      loginStatus.textContent = 'Chave de acesso incorreta.';
      return;
    }
    accessKey = key;
    localStorage.setItem(STORAGE_KEY, key);
    showDashboard();
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    accessKey = '';
    dashboardWrap.style.display = 'none';
    loginWrap.style.display = 'block';
  });

  function showDashboard(){
    loginWrap.style.display = 'none';
    dashboardWrap.style.display = 'block';
    loadReservations();
  }

  const savedKey = localStorage.getItem(STORAGE_KEY);
  if (savedKey) {
    tryLoadWithKey(savedKey).then(ok => {
      if (ok) { accessKey = savedKey; showDashboard(); }
    });
  }

  function formatDate(d){
    if(!d) return '—';
    const s = String(d).split('T')[0];
    const [y,m,day] = s.split('-');
    if(!y || !m || !day) return s;
    return `${day}/${m}/${y}`;
  }
  function formatDateTime(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  }

  // ---- Filtros ----
  const fName = document.getElementById('fName');
  const fStatus = document.getElementById('fStatus');
  const fFrom = document.getElementById('fFrom');
  const fTo = document.getElementById('fTo');
  document.getElementById('clearFilters').addEventListener('click', () => {
    fName.value = ''; fStatus.value = ''; fFrom.value = ''; fTo.value = '';
    applyFilters();
  });
  [fName, fStatus, fFrom, fTo].forEach(el => el.addEventListener('input', applyFilters));

  function applyFilters(){
    const nameQ = fName.value.trim().toLowerCase();
    const statusQ = fStatus.value;
    const fromQ = fFrom.value;
    const toQ = fTo.value;

    const filtered = allRows.filter(r => {
      if (nameQ && !(r.guest_name || '').toLowerCase().includes(nameQ)) return false;
      if (statusQ && r.status !== statusQ) return false;
      if (fromQ && String(r.check_in).split('T')[0] < fromQ) return false;
      if (toQ && String(r.check_in).split('T')[0] > toQ) return false;
      return true;
    });
    renderTable(filtered);
  }

  function renderTable(rows){
    tbody.innerHTML = '';
    if(rows.length === 0){
      table.style.display = 'none';
      statusEl.textContent = 'Nenhuma reserva encontrada.';
      statusEl.className = 'status';
      return;
    }
    table.style.display = 'table';
    statusEl.textContent = `${rows.length} reserva(s) encontrada(s).`;
    statusEl.className = 'status';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const st = r.status || 'pendente';
      tr.innerHTML = `
        <td data-label="Hóspede">${r.guest_name || '—'}</td>
        <td data-label="Contato">${r.guest_contact || '—'}</td>
        <td data-label="Check-in"><span class="badge">${formatDate(r.check_in)}</span></td>
        <td data-label="Check-out"><span class="badge">${formatDate(r.check_out)}</span></td>
        <td data-label="Hóspedes">${r.guests || '—'}</td>
        <td data-label="Status"><span class="pill ${st}">${st}</span></td>
        <td data-label="Ações"></td>
      `;
      const actionsCell = tr.querySelector('td:last-child');
      const actions = document.createElement('div');
      actions.className = 'row-actions';

      if (st !== 'confirmada') {
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn small confirm';
        confirmBtn.textContent = 'Confirmar';
        confirmBtn.addEventListener('click', () => updateStatus(r.id, 'confirmada'));
        actions.appendChild(confirmBtn);
      }
      if (st !== 'cancelada') {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn small cancel';
        cancelBtn.textContent = 'Cancelar';
        cancelBtn.addEventListener('click', () => updateStatus(r.id, 'cancelada'));
        actions.appendChild(cancelBtn);
      }
      if (st !== 'pendente') {
        const pendingBtn = document.createElement('button');
        pendingBtn.className = 'btn small';
        pendingBtn.style.background = 'transparent';
        pendingBtn.style.border = '1px solid rgba(47,74,58,.25)';
        pendingBtn.style.color = 'var(--forest)';
        pendingBtn.textContent = 'Reabrir';
        pendingBtn.addEventListener('click', () => updateStatus(r.id, 'pendente'));
        actions.appendChild(pendingBtn);
      }
      actionsCell.appendChild(actions);
      tbody.appendChild(tr);
    });
  }

  async function updateStatus(id, newStatus){
    try {
      const res = await fetch(SHEETS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'update_status', key: accessKey, id: id, status: newStatus })
      });
      const result = await res.json();
      if (!result || result.status !== 'ok') throw new Error(result && result.error);
      await loadReservations();
    } catch (err) {
      console.error(err);
      alert('Não foi possível atualizar essa reserva agora. Tente novamente.');
    }
  }

  // ---- Carregamento dos dados ----
  async function tryLoadWithKey(key){
    if (!SHEETS_WEBAPP_URL || SHEETS_WEBAPP_URL.includes('COLE_AQUI')) {
      loginStatus.textContent = 'O painel ainda não foi configurado (veja o README).';
      return false;
    }
    try {
      const res = await fetch(`${SHEETS_WEBAPP_URL}?key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if (data && data.error) return false;
      allRows = Array.isArray(data) ? data : [];
      applyFilters();
      renderCalendar();
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  }

  async function loadReservations(){
    statusEl.textContent = 'Carregando reservas...';
    statusEl.className = 'status';
    const ok = await tryLoadWithKey(accessKey);
    if (!ok) {
      statusEl.textContent = 'Não foi possível carregar as reservas agora.';
      statusEl.className = 'status error';
    }
  }
  document.getElementById('refreshBtn').addEventListener('click', loadReservations);

  // ---- Calendário: mostra, por dia, se há reserva pendente ou confirmada ----
  function toISODate(d){ return d.toISOString().split('T')[0]; }

  function expandRange(checkInStr, checkOutStr){
    const dates = [];
    let d = new Date(String(checkInStr).split('T')[0] + 'T00:00:00');
    const end = new Date(String(checkOutStr).split('T')[0] + 'T00:00:00');
    while (d < end) {
      dates.push(toISODate(d));
      d.setDate(d.getDate() + 1);
    }
    return dates;
  }

  function renderCalendar(){
    const monthNames = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    document.getElementById('calTitle').textContent = `${monthNames[month]} ${year}`;

    // mapa dia -> status mais "forte" no dia (confirmada tem prioridade sobre pendente)
    const dayStatus = {};
    allRows.forEach(r => {
      if (!r.check_in || !r.check_out) return;
      if (r.status !== 'confirmada' && r.status !== 'pendente') return;
      expandRange(r.check_in, r.check_out).forEach(iso => {
        if (r.status === 'confirmada' || !dayStatus[iso]) dayStatus[iso] = r.status;
      });
    });

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['D','S','T','Q','Q','S','S'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < startOffset; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = toISODate(new Date(year, month, day));
      const el = document.createElement('div');
      el.textContent = day;
      const st = dayStatus[iso];
      el.className = 'cal-day' + (st ? ' ' + st : '');
      grid.appendChild(el);
    }
  }

  document.getElementById('calPrev').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1);
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1);
    renderCalendar();
  });
</script>
</body>
</html>
